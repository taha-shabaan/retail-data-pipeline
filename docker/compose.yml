services:
  postgres:
    image: postgres:16-alpine
    container_name: retail-postgres
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "15432:5432"
    volumes:
      # SQL schema + grocery_sales seed
      - ./init:/docker-entrypoint-initdb.d:ro
      # Complementary Parquet (extra_data.parquet) — generate with: make seed
      - ../data/raw:/data/raw:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 5s
      retries: 10
